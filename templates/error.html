<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ code }} — {{ title }} | SPARK Desk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * , *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #0d2b6b 0%, #071a4d 60%, #050f30 100%);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 18px;
      padding: 44px 38px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .code {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 64px;
      line-height: 1;
      color: #0a2472;
      letter-spacing: 2px;
    }
    .code span { color: #ffc107; }
    .title {
      margin-top: 10px;
      font-size: 19px;
      font-weight: 700;
      color: #0a2472;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .message {
      margin-top: 14px;
      font-size: 14.5px;
      line-height: 1.7;
      color: #5c6478;
    }
    .actions {
      margin-top: 30px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: .3px;
      transition: transform .2s, box-shadow .2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ffd54f, #ffc107);
      color: #0a2472;
      border: 1.5px solid #e0a800;
      box-shadow: 0 4px 12px rgba(255,193,7,0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255,193,7,0.45); }
    .btn-ghost {
      background: #fff;
      color: #0a2472;
      border: 1.5px solid #cdd6e6;
    }
    .btn-ghost:hover { background: #f5f7fb; transform: translateY(-2px); }
    .brand {
      margin-top: 26px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #b7bfd1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">{{ code }}<span>.</span></div>
    <div class="title">{{ title }}</div>
    <p class="message">{{ message }}</p>
    <div class="actions">
      {% if show_login_link %}
        <a class="btn btn-primary" href="{{ url_for('login') }}">← Back to Login</a>
      {% else %}
        <a class="btn btn-primary" href="{{ url_for('welcome') }}">← Back to Dashboard</a>
      {% endif %}
      <a class="btn btn-ghost" href="javascript:history.back()">Go Back</a>
    </div>
    <div class="brand">SPARK Desk — SECE Hostel Portal</div>
  </div>
</body>
</html>
